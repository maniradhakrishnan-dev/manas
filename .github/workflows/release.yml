name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri Desktop & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Manas v__VERSION__'
          releaseBody: |
            ### 🧭 Manas v__VERSION__
            Tactile, distraction-free daily planner and thinking space.

            #### 📦 Download Assets:
            - **Android**: Download `manas.apk` to install directly on your phone or tablet.
            - **Linux**: Download `.deb` for Ubuntu/Debian or `.AppImage` for any Linux distribution.
            - **macOS**: Download `.dmg` (Universal binary for Apple Silicon & Intel).
            - **Windows**: Download `.msi` or `.exe` installer.

            #### 🔒 Privacy & Architecture:
            - 100% offline-first.
            - All entries stay strictly local on your device.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    name: Build Android APK
    needs: release-desktop
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          ANDROID_NDK_VERSION="26.1.10909125"
          echo "Installing NDK $ANDROID_NDK_VERSION"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Initialize Android Scaffolding
        run: npx tauri android init --ci

      - name: Build Android APK
        run: npx tauri android build --apk

      - name: Copy & Rename APK
        run: |
          mkdir -p dist-apk
          find src-tauri/gen/android -name "*.apk" -exec cp {} dist-apk/ \;
          ls -la dist-apk/

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist-apk/*.apk
