[package]
name = "manas"
version = "0.1.0"
description = "Manas — Daily Planner & Thinking Space"
authors = ["Manas"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "manas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
dirs = "7.0.0"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"

