[package]
name = "mrt"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
eframe = "0.36.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = "s"         # Optimize for binary size & speed
lto = true              # Link-time optimization
codegen-units = 1       # Maximum optimizations across crates
panic = "abort"         # Remove panic unwinding tables for smaller size
strip = true            # Strip symbols and debuginfo


